<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Объявления — Недвижимость Бишкек</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet"/>
  <link th:href="@{/css/style.css}" rel="stylesheet"/>
</head>
<body>

<div th:replace="~{layout :: #navFragment}"></div>

<div class="container my-4">
  <h2 class="mb-4"><i class="bi bi-search me-2"></i>Объявления</h2>

  <!-- Фильтры -->
  <div class="card mb-4 shadow-sm">
    <div class="card-body">
      <form th:action="@{/listings}" method="get" class="row g-3">
        <div class="col-md-4">
          <input type="text" name="keyword" class="form-control"
                 placeholder="Поиск по заголовку..."
                 th:value="${keyword}"/>
        </div>
        <div class="col-md-3">
          <select name="dealType" class="form-select">
            <option value="">Тип сделки</option>
            <option th:each="dt : ${dealTypes}" th:value="${dt}"
                    th:text="${dt.name() == 'SALE' ? 'Продажа' : 'Аренда'}"
                    th:selected="${dt == dealType}">
            </option>
          </select>
        </div>
        <div class="col-md-2">
          <input type="number" min="0" step="1" name="minPrice" class="form-control"
                 placeholder="Цена от" th:value="${minPrice}"/>
        </div>
        <div class="col-md-2">
          <input type="number" min="0" step="1" name="maxPrice" class="form-control"
                 placeholder="Цена до" th:value="${maxPrice}"/>
        </div>
        <div class="col-md-1">
          <button type="submit" class="btn btn-primary w-100">
            <i class="bi bi-search"></i>
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- Результаты -->
  <p class="text-muted">
    Найдено: <strong th:text="${listings.totalElements}">0</strong> объявлений
  </p>

  <div class="row g-4">
    <div th:each="listing : ${listings.content}" class="col-md-4">
      <div class="card h-100 shadow-sm listing-card">
        <img th:src="${listing.primaryImageUrl}" class="card-img-top"
             style="height:200px; object-fit:cover;"
             onerror="this.src='https://via.placeholder.com/400x200?text=Нет+фото'"/>
        <div class="card-body">
          <span th:if="${listing.dealType.name() == 'SALE'}" class="badge bg-danger mb-2">Продажа</span>
          <span th:if="${listing.dealType.name() == 'RENT'}" class="badge bg-success mb-2">Аренда</span>
          <h5 class="card-title" th:text="${listing.title}">Заголовок</h5>
          <p class="text-muted small mb-1">
            <i class="bi bi-geo-alt me-1"></i>
            <span th:text="${listing.property.fullAddress}">Адрес</span>
          </p>
          <p class="text-muted small">
            <i class="bi bi-house me-1"></i>
            <span th:text="${(listing.property.rooms != null ? listing.property.rooms + ' комн., ' : '')
                              + listing.property.area + ' м²'}"></span>
          </p>
          <p class="fw-bold text-primary fs-5 mb-0"
             th:text="${#numbers.formatDecimal(listing.price, 0, 'COMMA', 0, 'POINT')} + ' сом'">
          </p>
        </div>
        <div class="card-footer bg-transparent d-flex justify-content-between align-items-center">
          <small class="text-muted">
            <i class="bi bi-eye me-1"></i><span th:text="${listing.viewsCount}">0</span>
          </small>
          <a th:href="@{/listings/{id}(id=${listing.id})}" class="btn btn-primary btn-sm">Подробнее</a>
        </div>
      </div>
    </div>
    <div th:if="${listings.content.empty}" class="col-12 text-center py-5">
      <i class="bi bi-inbox fs-1 text-muted"></i>
      <p class="text-muted mt-2">Объявления не найдены</p>
    </div>
  </div>

  <!-- Пагинация: тащим за собой все активные фильтры -->
  <nav th:if="${listings.totalPages > 1}" class="mt-4">
    <ul class="pagination justify-content-center">
      <li class="page-item" th:classappend="${listings.first} ? 'disabled'">
        <a class="page-link" th:href="@{/listings(page=${listings.number - 1},
                                                  keyword=${keyword},
                                                  dealType=${dealType},
                                                  minPrice=${minPrice},
                                                  maxPrice=${maxPrice})}">←</a>
      </li>
      <li th:each="i : ${#numbers.sequence(0, listings.totalPages - 1)}"
          class="page-item" th:classappend="${i == listings.number} ? 'active'">
        <a class="page-link"
           th:href="@{/listings(page=${i},
                                keyword=${keyword},
                                dealType=${dealType},
                                minPrice=${minPrice},
                                maxPrice=${maxPrice})}"
           th:text="${i + 1}">1</a>
      </li>
      <li class="page-item" th:classappend="${listings.last} ? 'disabled'">
        <a class="page-link" th:href="@{/listings(page=${listings.number + 1},
                                                  keyword=${keyword},
                                                  dealType=${dealType},
                                                  minPrice=${minPrice},
                                                  maxPrice=${maxPrice})}">→</a>
      </li>
    </ul>
  </nav>
</div>

<div th:replace="~{layout :: #footerFragment}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
