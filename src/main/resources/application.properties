# ===== База данных PostgreSQL =====
spring.datasource.url=jdbc:postgresql://localhost:5432/realestate_db
spring.datasource.username=postgres
spring.datasource.password=password
spring.datasource.driver-class-name=org.postgresql.Driver

# ===== JPA / Hibernate =====
# Используем update вместо validate, чтобы Hibernate мог работать с VARCHAR enum-колонками
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ===== SQL инициализация =====
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/schema.sql
spring.sql.init.data-locations=classpath:db/data.sql
spring.sql.init.continue-on-error=true

# ===== Thymeleaf =====
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.cache=false

# ===== Сервер =====
server.port=8080
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true

# ===== Загрузка фото =====
# Папка относительно рабочего каталога приложения (./uploads).
app.upload-dir=uploads
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

# ===== Логирование =====
logging.level.com.realestate=DEBUG
logging.level.org.hibernate.SQL=DEBUG
